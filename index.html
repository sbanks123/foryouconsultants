<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://guyqmvkipcvabkvfmreq.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Four You Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bottle:#14352D; --bottle-2:#1E4A3F; --mist:#E8EEEB; --paper:#FFFFFF; --line:#CFDAD5;
  --ink:#12231E; --ink-2:#4A5B55; --brass:#B8902F; --brass-soft:#F4EAD0; --bad:#B42318; --ok:#1B6B4A;
  --r:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mist);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.top{background:var(--bottle);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{font:500 13px Figtree,sans-serif;opacity:.7;margin-left:10px}
.pill{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.pill.err{background:var(--bad)}
.layout{display:grid;grid-template-columns:240px 1fr;gap:0;min-height:calc(100vh - 52px)}
aside{background:var(--paper);border-right:1px solid var(--line);padding:16px 12px}
aside h2{font-size:14px;color:var(--ink-2);font-weight:500;margin:0 8px 8px}
.cl{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:8px;cursor:pointer}
.cl:hover{background:var(--mist)}
.cl[aria-current=true]{background:var(--mist);font-weight:600}
.av{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 13px 'Bricolage Grotesque',sans-serif;flex:none}
.cl span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:24px clamp(16px,3vw,40px) 64px;max-width:1100px;width:100%}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.head h1{font-size:30px}
.head .sub{color:var(--ink-2)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:8px 0 24px}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--ink-2);font-weight:500}
nav.tabs button[aria-current=true]{color:var(--ink);border-color:var(--brass);font-weight:600}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:20px}
.panel h2{font-size:19px;margin-bottom:12px}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);margin-bottom:20px;overflow:hidden}
.ledger div{padding:16px 18px;border-right:1px solid var(--line)}
.ledger div:last-child{border-right:0}
.ledger b{display:block;font:700 28px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.ledger span{color:var(--ink-2);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
th{font-weight:600;color:var(--ink-2);font-size:14px}
.scroll{overflow-x:auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.up{color:var(--ok)}.down{color:var(--bad)}
form .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:14px;font-weight:500;color:var(--ink-2)}
input,select{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;min-height:42px}
input[type=color]{padding:3px;height:42px}
input[type=checkbox]{display:inline-block;width:auto;min-height:0;margin:0 6px 0 0}
.chk{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px}
.chk label{display:flex;align-items:center;color:var(--ink)}
.btn{background:var(--bottle);color:#fff;border:0;border-radius:6px;padding:10px 18px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{background:var(--bottle-2)}
.btn:disabled{opacity:.6;cursor:progress}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--mist)}
.link{background:none;border:0;color:var(--bottle);text-decoration:underline;cursor:pointer;padding:4px}
.link.del{color:var(--bad)}
.hint{color:var(--ink-2);font-size:14px;margin:0 0 12px}
.empty{color:var(--ink-2);padding:12px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--ink-2);margin-top:6px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:12px Figtree,sans-serif;fill:#4A5B55}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--bottle);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9}
.toast.err{background:var(--bad)}
.banner{background:var(--brass-soft);border:1px solid var(--brass);border-radius:var(--r);padding:12px 16px;margin-bottom:20px}
.foot{color:var(--ink-2);font-size:13px;margin-top:32px}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px}
  aside h2{display:none}
  .cl{width:auto;flex:none}
  .ledger{grid-template-columns:1fr 1fr}
  .ledger div:nth-child(2){border-right:0}
  .ledger div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .grid2{grid-template-columns:1fr}
  .top{padding:10px 16px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.authbox{max-width:440px;margin:40px auto;padding:0 16px}.authbox h1{font-size:28px;margin-bottom:12px}.authbox input{max-width:100%}code{font:14px ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading from Supabase…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<noscript>This app needs JavaScript.</noscript>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
